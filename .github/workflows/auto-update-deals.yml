name: Actualizare Automata Oferte & Tarife Live

on:
  schedule:
    # Ruleaza automat de 4 ori pe zi la ore de varf pentru publicul din Romania:
    # - 06:25 UTC = 08:25 ora Romaniei (dimineata la cafea)
    # - 11:25 UTC = 13:25 ora Romaniei (la pranz)
    # - 16:25 UTC = 18:25 ora Romaniei (dupa programul de lucru)
    # - 19:25 UTC = 21:25 ora Romaniei (seara de vacanta)
    # Rularea la minutul :25 evita congestia de sistem GitHub Actions de la ore fixe (:00)
    - cron: '25 6,11,16,19 * * *'
  workflow_dispatch: # Permite rularea manuala oricand cu un singur click din tabul GitHub Actions

jobs:
  update-deals:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: ✈️ Clonare Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Configurare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔍 Rulare Motor Verificare Oferte & Tarife Live
        run: |
          python scripts/deal_updater.py

      - name: 🚀 Commit & Push Modificari
        run: |
          git config --local user.email "bot@ponturivacante.ro"
          git config --local user.name "Ponturi Vacante Bot"
          git add data/deals.json data/romania_deals.json data/cruises.json
          if git diff --staged --quiet; then
            echo "Nicio modificare de pret sau oferte noi detectata."
          else
            git commit -m "[auto] Verificare tarife & publicare oferte noi ($(date +'%Y-%m-%d %H:%M'))"
            git push origin HEAD:main
          fi
